# Rebuilt for PT Deck
# Picks reference slot B1 in MetricAB (column B, row 1) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot B1
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: B1

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
