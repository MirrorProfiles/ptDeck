# Converted from your SoundFlow script: EQ3 7-Band "EAS Bleed Filter" via AudioSuite, then fades:
#  - Batch Fades window (several clips): new fades only, fade in 1 ms, crossfade 3 ms where clips
#    touch, fade out 150 ms where nothing follows; Equal Power wherever it's offered.
#  - Crossfade window (a single join): Equal Power.
# For equal gain crossfades instead, change 'Equal Power' to 'Equal Gain'.
name: Tom Clean Bleed
steps:
- audiosuite: EQ3 7-Band

- audiosuite preset: EAS Bleed Filter

- audiosuite render:
  processing: clip by clip      # each region processed on its own (never consolidated)

- run macro: Close First AudioSuite plugin

- press: ctrl+alt+shift+tab

- menu: Edit > Fades > Create...

- if window: Batch Fades
  or: Crossfade                # whichever opens first decides
  then:
  - checkbox: Create new fade ins
    set: on
    window: Batch Fades
    group: Fade In Operation
  - checkbox: Adjust existing fade in shape & slope
    set: off
    window: Batch Fades
    group: Fade In Operation
  - checkbox: Adjust existing fade in length
    set: off
    window: Batch Fades
    group: Fade In Operation
  - checkbox: Create new crossfades
    set: on
    window: Batch Fades
    group: Crossfade Operation
  - checkbox: Adjust existing crossfade shape & slope
    set: off
    window: Batch Fades
    group: Crossfade Operation
  - checkbox: Adjust existing crossfade length
    set: off
    window: Batch Fades
    group: Crossfade Operation
  - checkbox: Create new fade outs
    set: on
    window: Batch Fades
    group: Fade Out Operation
  - checkbox: Adjust existing fade out shape & slope
    set: off
    window: Batch Fades
    group: Fade Out Operation
  - checkbox: Adjust existing fade out length
    set: off
    window: Batch Fades
    group: Fade Out Operation
  - set text: "#1"
    to: 1
    window: Batch Fades
    group: Fade In Operation
    typing: true
  - set text: "#1"
    to: 3
    window: Batch Fades
    group: Crossfade Operation
    typing: true
  - set text: "#1"
    to: 150
    window: Batch Fades
    group: Fade Out Operation
    typing: true
  - click: Equal Power
    kind: radio button
    all: true
    window: Batch Fades
    optional: true
  - click: OK
    window: Batch Fades
  else:
  - click: Equal Power
    kind: radio button
    window: Crossfade
    group: Slope
  - click: OK
    window: Crossfade
