# Rebuilt for PT Deck
# Picks reference slot D2 in MetricAB (column D, row 2) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot D2
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: D2

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
