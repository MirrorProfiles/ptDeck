# Rebuilt for PT Deck
# Picks reference slot B4 in MetricAB (column B, row 4) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot B4
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: B4

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
