# Rebuilt for PT Deck
# Toggles MetricAB's Sides (listen without the centre).
# Opens MetricAB on -OUT MASTER if needed (and closes it again afterwards).
name: Metric Sides
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric button: sides

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
