# Rebuilt for PT Deck: duplicates the playlist on the selected tracks, renamed Kick.Edit.01 -> Kick.C
name: Rename to .C
steps:
- press: ctrl+cmd+backslash

- accept dialog                 # Pro Tools 2026 asks for the new playlist's name: keep the default

- press: alt+shift+r            # Batch Track Rename

- wait for window: Batch Track Rename

- checkbox: Replace
  set: on
  window: Batch Track Rename

- set text: "#1"            # Replace: Find
  to: "Edit.01"
  window: Batch Track Rename
  typing: true

- set text: "#2"            # Replace: Replace with
  to: "C"
  window: Batch Track Rename
  typing: true

- checkbox: Clear Existing Name
  set: off
  window: Batch Track Rename

- checkbox: Regular Expressions
  set: off
  window: Batch Track Rename

- checkbox: Trim
  set: off
  window: Batch Track Rename

- checkbox: Add
  set: off
  window: Batch Track Rename

- checkbox: Numbering
  set: off
  window: Batch Track Rename

- click: OK
  window: Batch Track Rename
