# Rebuilt for PT Deck (replaces SoundFlow's "Commit or Freeze up to Selected Insert"):
# commits the edit selection on the selected tracks with all inserts,
# rendering volume/mute and pan automation.
name: Commit Track
steps:
- menu: Track > Commit...

- wait for window: Commit Tracks

- popup: "#1"                  # the 'Commit:' menu (shows Selected Tracks / Edit Selection)
  choose: Edit Selection
  window: Commit Tracks

- checkbox: Volume and Mute
  set: on
  window: Commit Tracks

- checkbox: Pan
  set: on
  window: Commit Tracks

- click: OK
  window: Commit Tracks

- wait for window: Commit Tracks
  gone: true
  timeout: 120
