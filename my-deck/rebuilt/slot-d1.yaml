# Rebuilt for PT Deck
# Picks reference slot D1 in MetricAB (column D, row 1) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot D1
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: D1

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
