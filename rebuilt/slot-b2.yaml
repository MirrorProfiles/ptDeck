# Rebuilt for PT Deck
# Picks reference slot B2 in MetricAB (column B, row 2) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot B2
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: B2

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
