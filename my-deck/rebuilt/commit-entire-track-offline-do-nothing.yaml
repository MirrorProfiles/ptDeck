# Rebuilt for PT Deck: Track > Commit with
#   Commit: Entire Track (Selected Tracks), Offline on, Source Tracks: Do Nothing
#   Consolidate Clips on, render Volume and Mute + Pan automation.
name: Commit - Entire Track - Offline - Do Nothing
steps:
- menu: Track > Commit...

- wait for window: Commit Tracks

- popup: "#1"                  # Commit: Selected Tracks
  choose: Selected Tracks
  window: Commit Tracks

- checkbox: Consolidate Clips
  set: on
  window: Commit Tracks

- checkbox: Volume and Mute
  set: on
  window: Commit Tracks

- checkbox: Pan
  set: on
  window: Commit Tracks

- checkbox: Offline
  set: on
  window: Commit Tracks

- popup: "#2"                  # Source Tracks: Do Nothing
  choose: Do Nothing
  window: Commit Tracks

- click: OK
  window: Commit Tracks

- wait for window: Commit Tracks
  gone: true
  timeout: 120
