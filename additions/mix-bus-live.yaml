# Makes the Open Mix Bus Plugin keys show what's on the (PRINT) track, live.
update buttons on: Mix Bus
buttons:
- macro: Open Mix Bus Plugin 1
  set:
    live: 1
    live track: (PRINT)
  remove:
  - label
  - icon
  - color
