# Rebuilt for PT Deck: Track > Commit with
#   Commit: Entire Track (Selected Tracks), Offline off, Source Tracks: Hide and Make Inactive
#   Consolidate Clips on, render Volume and Mute + Pan automation.
name: Commit - Entire Track - Realtime - Hide
steps:
- menu: Track > Commit...

- wait for window: Commit Tracks

- popup: "#1"                  # Commit: Selected Tracks
  choose: Selected Tracks
  window: Commit Tracks

- checkbox: Consolidate Clips
  set: on
  window: Commit Tracks

- checkbox: Volume and Mute
  set: on
  window: Commit Tracks

- checkbox: Pan
  set: on
  window: Commit Tracks

- checkbox: Offline
  set: off
  window: Commit Tracks

- popup: "#2"                  # Source Tracks: Hide and Make Inactive
  choose: Hide and Make Inactive
  window: Commit Tracks

- click: OK
  window: Commit Tracks

- wait for window: Commit Tracks
  gone: true
  timeout: 3600
