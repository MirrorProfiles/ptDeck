# Rebuilt for PT Deck
# Picks reference slot C1 in MetricAB (column C, row 1) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot C1
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: C1

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
