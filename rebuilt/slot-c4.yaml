# Rebuilt for PT Deck
# Picks reference slot C4 in MetricAB (column C, row 4) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot C4
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: C4

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
