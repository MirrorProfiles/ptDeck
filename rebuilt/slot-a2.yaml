# Rebuilt for PT Deck
# Picks reference slot A2 in MetricAB (column A, row 2) by setting the plug-in's own
# slot number, so there's no clicking. If MetricAB wasn't open, it's closed again afterwards.
name: Slot A2
steps:
- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: open

- metric slot: A2

- plugin window: ADPTR MetricAB
  track: "-OUT MASTER"
  set: restore
